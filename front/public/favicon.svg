<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop stop-color="#7c3aed"/>
      <stop offset="1" stop-color="#4338ca"/>
    </linearGradient>
    <linearGradient id="cap" x1="10" y1="12" x2="54" y2="46" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e0d7ff"/>
    </linearGradient>
  </defs>

  <!-- Background rounded square -->
  <rect width="64" height="64" rx="14" fill="url(#bg)"/>

  <!-- Graduation cap — diamond top -->
  <polygon points="32,11 55,23 32,35 9,23" fill="url(#cap)"/>

  <!-- Cap body (trapezoid under the diamond) -->
  <path d="M19,27.5 L19,40 Q32,48.5 45,40 L45,27.5 L32,33.5 Z" fill="white" opacity="0.90"/>

  <!-- Tassel cord -->
  <line x1="55" y1="23" x2="55" y2="37" stroke="white" stroke-width="3" stroke-linecap="round" opacity="0.85"/>

  <!-- Tassel end -->
  <circle cx="55" cy="39.5" r="3" fill="white" opacity="0.85"/>

  <!-- Subtle sparkle — AI accent, top-right -->
  <g opacity="0.75">
    <line x1="49" y1="7" x2="49" y2="11"  stroke="white" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="47" y1="9" x2="51" y2="9"   stroke="white" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="47.5" y1="7.5" x2="50.5" y2="10.5" stroke="white" stroke-width="1" stroke-linecap="round"/>
    <line x1="50.5" y1="7.5" x2="47.5" y2="10.5" stroke="white" stroke-width="1" stroke-linecap="round"/>
  </g>
</svg>
